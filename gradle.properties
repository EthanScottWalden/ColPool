org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# Debug-only emulator toggle (see docs/adr/0001-android-setup.md).
# Override per build: ./gradlew assembleDebug -Pcolpool.useEmulators=false
colpool.useEmulators=true
# 10.0.2.2 is the Android emulator's alias for the host machine.
colpool.emulatorHost=10.0.2.2
# Provisional: #12 owns .firebaserc and must match this.
colpool.emulatorProjectId=demo-colpool

# Windows only: Run on `app` starts the Firebase emulators in WSL (task ensureFirebaseEmulators).
# Never active on Linux or when CI is set. Override: -Pcolpool.autoStartEmulators=false
colpool.autoStartEmulators=true
# Path of the ColPool checkout inside WSL (no spaces). Override per machine in ~/.gradle/gradle.properties.
colpool.wslCheckout=~/ColPool
